<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alvitur Innskráning</title>
<style>
body { font-family: sans-serif; background:#0a0a1a; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; margin:0; }
.card { background:#1a1a2e; border-radius:12px; padding:30px; max-width:420px; width:100%; }
h1 { color:#7ec8e3; text-align:center; }
textarea { width:100%; height:100px; background:#0d0d1f; border:1px solid #333; border-radius:8px; color:#e0e0e0; padding:12px; font-size:.85em; font-family:monospace; resize:vertical; }
button { width:100%; padding:14px; background:#7ec8e3; color:#0a0a1a; border:none; border-radius:8px; font-size:1em; font-weight:700; cursor:pointer; margin-top:16px; }
.msg { margin-top:16px; text-align:center; min-height:24px; }
.ok { color:#4caf50; } .err { color:#f44336; }
</style>
</head>
<body>
<div class="card">
<h1>🧠 Alvitur</h1>
<p style="text-align:center; color:#888;">Límdu beta token til að skrá þig inn</p>
<textarea id="t" placeholder="eyJ0eXAiOiJKV1Q..."></textarea>
<button onclick="login()">Skrá inn</button>
<div class="msg" id="msg"></div>
</div>
<script>
function login() {
  var t = document.getElementById('t').value.trim(), m = document.getElementById('msg');
  if (!t) { m.className='msg err'; m.textContent='Límdu token í reitinn'; return; }
  try {
    var p = JSON.parse(atob(t.split('.')[1]));
    if (p.exp && p.exp < Math.floor(Date.now()/1000)) { m.className='msg err'; m.textContent='Token er útrunninn!'; return; }
    localStorage.setItem('alvitur_token', t);
    m.className='msg ok'; m.textContent='✅ Innskráning tókst! Flutti á Vitann...';
    setTimeout(function(){ location.href='/' }, 1000);
  } catch(e) { m.className='msg err'; m.textContent='Ógilt token snið.'; }
}
</script>
</body>
</html>
