<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alvitur Innskráning</title>
<link rel="stylesheet" href="/static/login.css">
</head>
<body>
<div class="card">
<h1>Alvitur</h1>
<p class="sub">Skráðu þig inn til að halda áfram</p>

<div class="tabs">
<button class="tab tab--active" id="tab-magic">Innskráningartengill</button>
<button class="tab" id="tab-token">Aðgangslykill</button>
</div>

<div class="panel panel--active" id="panel-magic">
<label for="email">Netfang</label>
<input type="email" id="email" placeholder="nafn@daemi.is" autocomplete="email">
<button class="submit" id="magic-btn">Senda innskráningartengil</button>
</div>

<div class="panel" id="panel-token">
<label for="t">Aðgangslykill</label>
<textarea id="t" placeholder="eyJ0eXAiOiJKV1Q..."></textarea>
<button class="submit" id="token-btn">Skrá inn</button>
</div>

<div class="msg" id="msg"></div>
</div>
<script src="/static/login.js"></script>
</body>
</html>
